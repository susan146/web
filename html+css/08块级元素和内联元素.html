<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游山恋</title>
</head>

<body>
  <h1>友善</h1>
  <!-- 加粗： <strong>友善</strong> -->
  倾斜： <em>友善</em>
  下划线： <ins>友善</ins>
  删除线： <del>友善</del>
  <h2>友善来拿</h2>
  <p>我是块级元素，我会独占一行<strong>加粗</strong></p>
  <div>我是块级元素，我会独占一行</div>
  <em>我是内联元素，不会独占一行</em>
  <ins>我是内联元素，不会独占一行</ins>
  <strong>我是内联元素，不会独占一行</strong>
  <!-- 特殊情况：p里面不能包含其它块级元素 -->
</body>

</html>
