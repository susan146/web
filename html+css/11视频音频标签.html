<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>视频标签</h2>
  <!-- 在h5中如果属性值相同，可以省略属性值 -->
  <video src="./media/1.mp4" width="400" controls autoplay loop poster="./media/6.jpg"></video>
  <!-- autoplay：自动播放 muted：静音 loop：循环播放 -->
  <h2>音频标签</h2>
  <audio src="./media/2.mp3" controls autoplay loop></audio>
  <!-- autoplay：自动播放 loop：循环播放 -->
</body>

</html>
