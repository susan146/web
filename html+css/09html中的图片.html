<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>图像标签的基本使用</h2>
  <img src="img/1.png" alt="黛伦">
  <!-- src：图片的路径
  alt：图片的替代文本，当图片加载失败时，会显示替代文本
  title：图片的标题 -->
  <h2>图像标签的宽度和高度修改</h2>
  <img src="img/1.png" alt="黛伦" width="300">
  <!-- 一般情况下宽度和高度修改其中一个即可剩下的等比例缩放 -->
  <h2>图像标签添加title</h2>
  <img src="img/1.png" alt="黛伦" width="300" title="黛伦麦外敷">
  <!-- title：图片的标题 -->
  <!-- 网页优化：优先webp和avif -->
</body>

</html>
